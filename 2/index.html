<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Tabuada</title>
</head>
<body>

<h2>Tabuada</h2>

<input type="number" id="numero">
<button onclick="tabuada()">Mostrar</button>

<p id="resultado"></p>

<script>
function tabuada() {
    let numero = Number(document.getElementById("numero").value);
    let texto = "";

    for (let i = 1; i <= 10; i++) {
        texto += `${numero} x ${i} = ${numero * i}<br>`;
    }

    resultado.innerHTML = texto;
}
</script>

</body>
</html>
