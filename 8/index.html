<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Contar Vogais</title>
</head>
<body>

<h2>Contar Vogais</h2>

<input type="text" id="palavra">
<button onclick="contar()">Contar</button>

<p id="resultado"></p>

<script>
function contar() {
    let palavra = document.getElementById("palavra").value.toLowerCase();
    let total = 0;

    for (let letra of palavra) {
        if ("aeiou".includes(letra)) {
            total++;
        }
    }

    resultado.innerHTML = "Vogais: " + total;
}
</script>

</body>
</html>
