<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Inverter Palavra</title>
</head>
<body>

<h2>Inverter Palavra</h2>

<input type="text" id="palavra">
<button onclick="inverter()">Inverter</button>

<p id="resultado"></p>

<script>
function inverter() {
    let palavra = document.getElementById("palavra").value;

    let invertida = palavra.split("").reverse().join("");

    resultado.innerHTML = invertida;
}
</script>

</body>
</html>
