<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Maior Número</title>
</head>
<body>

<h2>Maior Número</h2>

<input type="number" id="n1">
<input type="number" id="n2">

<button onclick="comparar()">Comparar</button>

<p id="resultado"></p>

<script>
function comparar() {
    let n1 = Number(document.getElementById("n1").value);
    let n2 = Number(document.getElementById("n2").value);

    if (n1 > n2) {
        resultado.innerHTML = n1 + " é maior";
    } else if (n2 > n1) {
        resultado.innerHTML = n2 + " é maior";
    } else {
        resultado.innerHTML = "Números iguais";
    }
}
</script>

</body>
</html>
