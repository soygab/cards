<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Números Primos</title>
</head>
<body>

<h2>Números Primos</h2>

<button onclick="mostrar()">Mostrar</button>

<p id="resultado"></p>

<script>
function mostrar() {
    let texto = "";

    for (let n = 2; n <= 100; n++) {
        let primo = true;

        for (let i = 2; i < n; i++) {
            if (n % i === 0) {
                primo = false;
            }
        }

        if (primo) {
            texto += n + " ";
        }
    }

    resultado.innerHTML = texto;
}
</script>

</body>
</html>
